name: mind_builder
description: "A conversational CBT self-reflection prototype with a FastAPI LLM backend."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  drift: ^2.29.0
  drift_flutter: ^0.2.6
  sqlite3_flutter_libs: ^0.5.39
  path_provider: ^2.1.5
  intl: ^0.20.2
  http: ^1.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.6.0
  drift_dev: ^2.29.0

flutter:

  uses-material-design: true
  assets:
    - assets/
